<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Piggy Gradient -->
    <linearGradient id="pigBodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFA8BD" />
      <stop offset="50%" stop-color="#FF7597" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Piggy Ear Inside -->
    <linearGradient id="pigEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- 1 Real Coin Ring Gradient (Gold / Bronze) -->
    <linearGradient id="coinGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070" />
      <stop offset="35%" stop-color="#D49B28" />
      <stop offset="70%" stop-color="#FCE192" />
      <stop offset="100%" stop-color="#B37E17" />
    </linearGradient>

    <!-- 1 Real Coin Center Gradient (Silver) -->
    <linearGradient id="coinSilverCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glow/Drop Shadow -->
    <filter id="pigShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- PIGGY LEGS (Behind & Front) -->
  <g id="pig-legs">
    <!-- Back-left leg -->
    <rect x="36" y="86" width="14" height="18" rx="7" fill="#E11D48" />
    <!-- Back-right leg -->
    <rect x="74" y="86" width="14" height="18" rx="7" fill="#E11D48" />
    <!-- Front-left leg -->
    <rect x="30" y="89" width="15" height="18" rx="7.5" fill="#FF7597" />
    <!-- Front-right leg -->
    <rect x="68" y="89" width="15" height="18" rx="7.5" fill="#FF7597" />
    <!-- Hoof lines -->
    <path d="M 37.5 102 L 37.5 107" stroke="#BE123C" stroke-width="2" stroke-linecap="round"/>
    <path d="M 75.5 102 L 75.5 107" stroke="#BE123C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- PIGGY TAIL (Curly) -->
  <path d="M 19 68 C 12 67, 10 59, 14 55 C 18 51, 23 54, 21 61 C 20 64, 18 64, 17 62" 
        stroke="#FF7597" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- PIGGY MAIN BODY -->
  <g filter="url(#pigShadow)">
    <ellipse cx="58" cy="68" rx="42" ry="34" fill="url(#pigBodyGrad)" />
  </g>

  <!-- BACK EAR -->
  <path d="M 72 37 C 76 25, 87 23, 90 32 C 92 38, 86 44, 80 44 Z" fill="url(#pigEarGrad)" />

  <!-- COIN SLOT (Ranhura nas costas) -->
  <ellipse cx="56" cy="36" rx="14" ry="3.5" fill="#9F1239" />
  <ellipse cx="56" cy="35" rx="12" ry="2" fill="#4C0519" />

  <!-- 1 REAL COIN ENTERING THE SLOT -->
  <!-- Tilted slightly to show it entering the slot -->
  <g transform="translate(56, 32) rotate(-16) translate(-56, -32)" filter="url(#coinGlow)">
    <!-- Outer Gold Ring -->
    <circle cx="56" cy="22" r="19" fill="url(#coinGoldRing)" stroke="#A16207" stroke-width="1" />
    <!-- Inner Silver Center -->
    <circle cx="56" cy="22" r="12.5" fill="url(#coinSilverCenter)" stroke="#64748B" stroke-width="0.8" />
    
    <!-- Coin Ring Details (Grooves / Graphics similar to 1 Real) -->
    <path d="M 40 18 L 47 27" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 43 14 L 49 22" stroke="#FDE047" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 64 21 L 71 30" stroke="#B45309" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    
    <!-- 1 REAL Number & Text in the center -->
    <text x="53" y="24" font-family="'Arial Black', Impact, sans-serif" font-size="12" font-weight="900" fill="#1E293B" text-anchor="middle">1</text>
    <text x="56" y="30" font-family="'Arial', sans-serif" font-size="4.5" font-weight="bold" fill="#334155" text-anchor="middle" letter-spacing="0.5">REAL</text>

    <!-- Sparkle/Sheen on Coin -->
    <ellipse cx="50" cy="15" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-30, 50, 15)" />
    <polygon points="68,13 69,15 71,16 69,17 68,19 67,17 65,16 67,15" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- FRONT EAR -->
  <path d="M 82 42 C 88 30, 101 32, 103 42 C 104 49, 96 55, 88 53 Z" fill="url(#pigBodyGrad)" stroke="#E11D48" stroke-width="1" />
  <path d="M 85 43 C 89 35, 97 36, 98 42 C 99 47, 94 51, 89 49 Z" fill="url(#pigEarGrad)" />

  <!-- PIGGY HEAD HIGHLIGHT -->
  <ellipse cx="52" cy="55" rx="28" ry="16" fill="#FFA8BD" opacity="0.3" />

  <!-- CHEEKS (Blush) -->
  <ellipse cx="70" cy="74" rx="6" ry="4" fill="#FB7185" opacity="0.6" />
  <ellipse cx="94" cy="74" rx="4" ry="3" fill="#FB7185" opacity="0.5" />

  <!-- EYES REPRESENTED BY '$' (Cifrão) -->
  <!-- Left Eye ($) -->
  <g transform="translate(68, 54)">
    <circle cx="5" cy="5" r="7.5" fill="#FFF1F2" stroke="#E11D48" stroke-width="1" />
    <text x="5" y="9.5" font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">$</text>
  </g>

  <!-- Right Eye ($) -->
  <g transform="translate(86, 54)">
    <circle cx="5" cy="5" r="7" fill="#FFF1F2" stroke="#E11D48" stroke-width="1" />
    <text x="5" y="9" font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">$</text>
  </g>

  <!-- SNOUT / FOCINHO -->
  <g filter="url(#pigShadow)">
    <ellipse cx="92" cy="72" rx="14" ry="10" fill="#FFA4B8" stroke="#F43F5E" stroke-width="1.8" />
    <!-- Nostrils -->
    <ellipse cx="88" cy="72" rx="2.8" ry="4.2" fill="#BE123C" />
    <ellipse cx="96" cy="72" rx="2.8" ry="4.2" fill="#BE123C" />
    <!-- Snout shine -->
    <ellipse cx="92" cy="66" rx="6" ry="2" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- CUTE SMILE (Under snout) -->
  <path d="M 76 81 C 80 84, 86 84, 88 82" stroke="#BE123C" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>